name: Lint

# scripts/lint.sh's clang-format and clang-tidy checks (CLion's inspections
# need a CLion license, so they stay local), and actionlint over the
# workflows themselves.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # clang-format must match the version the code was formatted with, or the
  # two disagree on layout. PyPI's newest clang-tidy is 22, one major behind
  # CLion's bundled 23.
  CLANG_FORMAT_VERSION: 23.1.3
  CLANG_TIDY_VERSION: 22.1.8
  ACTIONLINT_VERSION: 1.7.12

jobs:
  clang:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install clang-format and clang-tidy
        run: pipx install "clang-format==$CLANG_FORMAT_VERSION" && pipx install "clang-tidy==$CLANG_TIDY_VERSION"

      - uses: ./.github/actions/setup-vcpkg
        with:
          cache-key: x64-linux

      # clang-tidy reads compile_commands.json; configuring writes it (and
      # installs the vcpkg packages whose headers the sources include).
      - name: Configure
        run: cmake --preset linux

      - name: Lint
        run: scripts/lint.sh

  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Run actionlint
        run: |
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | tar xz actionlint
          ./actionlint -color
